<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Brenno Alencar">
    <meta name="description" content="Tags sem conteúdo - hr, br, img e outras tags que não possuem texto interno">

    <title>Tags sem conteúdo</title>
</head>
<body>
    <h1>Tags sem conteúdo</h1>
    <p>Vamos utilizar algumas tags sem conteúdo para exemplos.</p>

    <!-- Linha horizontal -->
    <hr>

    <p>Temos também a quebra de linha</p>

    <!-- Quebra de linha -->
    <a href="#">Link1</a>
    <br>
    <a href="#">Link2</a>
    <br>
    <a href="#">Link3</a>
    <br>

    <!-- A tag img -->
    <img src="" alt="Descrição da imagem">
</body>
</html>
